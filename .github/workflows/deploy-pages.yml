name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  hotfix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply one-shot v0.1.3 hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('src/main.tsx')
          text = main.read_text()
          old = '<button className="timer-control hard" onClick={onToggle}>{running?\'PAUSE\':paused?\'CONTINUE\':\'START\'}</button>'
          new = '<button className="timer-control hard" onPointerDown={paused?()=>document.querySelector<HTMLButtonElement>(\'.timer-reset\')?.classList.remove(\'is-open\'):undefined} onClick={onToggle}>{running?\'PAUSE\':paused?\'CONTINUE\':\'START\'}</button>'
          if old not in text:
              raise SystemExit('Expected timer control markup was not found')
          main.write_text(text.replace(old, new, 1))

          package = Path('package.json')
          text = package.read_text()
          text = text.replace('"version":"1.0.0"', '"version":"0.1.3"', 1)
          package.write_text(text)

          lock = Path('package-lock.json')
          text = lock.read_text()
          text = text.replace('"version": "1.0.0"', '"version": "0.1.3"', 2)
          lock.write_text(text)
          PY

          cat > README.md <<'EOF'
          # CRONO

          Mobile world clock, timer, and stopwatch prototype built with React, TypeScript, and Vite. The interface follows a neobrutalist direction with flat saturated colors, heavy outlines, hard shadows, monospaced typography, and a cut-paper composition.

          On desktop and tablet, CRONO is presented inside an iPhone canvas with zoom controls. On real phones, the interface fills the screen directly, respects device safe areas, and preserves its vertical composition when the phone rotates.

          **[Open the interactive demo](https://r3neer.github.io/crono-neobrutal/)**

          ## Demos

          ### Time, physics, and interaction

          ![Ten-second timer, physical sand, and stopwatch controls](./public/demos/01-time-and-physics.gif)

          ### World clocks and palettes

          ![World-clock selection, deletion, search, and palettes](./public/demos/02-world-palettes.gif)

          ## Run locally

          ```powershell
          npm install
          npm run dev -- --port 5173
          ```

          Open `http://127.0.0.1:5173/`. To verify the production build:

          ```powershell
          npm run build
          npm run preview
          ```

          ## Regenerate the GIFs

          With the local server running on port `5173`:

          ```powershell
          npm run capture:demos
          ```

          The script captures the flows in Microsoft Edge and writes the final GIFs to `public/demos/`. Intermediate frames are stored under `artifacts/demo-frames/` and are excluded from the repository.

          ## Structure

          - `src/main.tsx`: digital clocks, timer, sand physics, stopwatch, and city management.
          - `src/style.css`: iPhone canvas, collage composition, cutouts, shadows, palettes, and animations.
          - `public/demos/`: animated demos used by this README.
          - `scripts/capture-demos.cjs`: reproducible Playwright demo flows.
          - `scripts/build-gifs.py`: shared palette generation and frame packaging.
          - `DESIGN.md`: original brief and subsequent design decisions.

          ## Scope

          Selected cities and the main clock are stored in `localStorage`. Active timers survive internal navigation, but not a browser reload. World clocks use real IANA time zones. There is no backend, background alarm, or sound.

          JetBrains Mono is bundled locally under its OFL license. Impact uses the system font with a condensed fallback.
          EOF

          cat >> DESIGN.md <<'EOF'

          ## Continue reset-retraction hotfix
          When the timer is paused, pressing CONTINUE starts retracting the RESET tab on pointer-down, rather than waiting for the resume state update. The countdown still resumes on the normal click activation, so keyboard semantics remain unchanged while pointer interaction receives immediate visual feedback.
          EOF

          cat > tests/timer-continue-reset.cjs <<'EOF'
          const {chromium,expect}=require('@playwright/test');

          (async()=>{
           const browser=await chromium.launch({channel:'msedge',headless:true});
           const page=await browser.newPage({viewport:{width:390,height:844}});
           await page.goto('http://127.0.0.1:5173/');
           const control=page.locator('.timer-control');
           await control.click();
           await control.click();
           const reset=page.getByLabel('Reset timer',{exact:true});
           await expect(reset).toHaveClass(/is-open/);
           await control.dispatchEvent('pointerdown',{pointerType:'mouse',button:0,bubbles:true});
           await expect(reset).not.toHaveClass(/is-open/);
           const transition=await reset.evaluate(el=>getComputedStyle(el).transitionDuration);
           expect(transition).toContain('0.16s');
           await control.dispatchEvent('pointerup',{pointerType:'mouse',button:0,bubbles:true});
           await control.dispatchEvent('click',{button:0,bubbles:true});
           await expect(control).toHaveText('PAUSE');
           await browser.close();
           console.log('Timer RESET retracts immediately on CONTINUE pointer-down');
          })().catch(error=>{console.error(error);process.exit(1)});
          EOF

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text())
          if 'node tests/timer-continue-reset.cjs' not in data['scripts']['test']:
              data['scripts']['test'] += ' && node tests/timer-continue-reset.cjs'
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          PY

          cat > .github/workflows/deploy-pages.yml <<'EOF'
          name: Deploy to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - run: npm run build
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: dist

            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              needs: build
              steps:
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          EOF

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.tsx package.json package-lock.json README.md DESIGN.md tests/timer-continue-reset.cjs .github/workflows/deploy-pages.yml
          git commit -m "fix: retract timer reset immediately on continue"
          git push origin HEAD:main
          git tag v0.1.3
          git push origin v0.1.3
      - run: npm ci
      - name: Verify hotfix
        run: |
          npm run build
          npm run dev -- --port 5173 > /tmp/crono-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish v0.1.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 --title "CRONO v0.1.3" --notes $'Hotfix for CRONO v0.1.2.\n\n## Fixes\n\n- TIMER RESET now starts retracting immediately when CONTINUE is pressed, instead of waiting for the resume state transition.\n- Added a regression test for immediate reset retraction.\n- Converted the README and repository documentation to English.\n\n## Demo\n\nhttps://r3neer.github.io/crono-neobrutal/'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: hotfix-build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
